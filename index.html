            <div class="col-sm-4 bg-primary-subtle p-3 text-start">
                <h5 class="text-center mb-3 fw-bold">Register</h5>
                <form>
                    <div class="mb-2">
                        <label for="firstname" class="form-label mb-1">Firstname</label>
                        <input type="text" class="form-control form-control-sm" id="firstname" placeholder="input firstname">
                    </div>
                    <div class="mb-2">
                        <label for="lastname" class="form-label mb-1">Lastname</label>
                        <input type="text" class="form-control form-control-sm" id="lastname" placeholder="input Lastname">
                    </div>
                    <div class="mb-2">
                        <label for="telephone" class="form-label mb-1">Telephone</label>
                        <input type="tel" class="form-control form-control-sm" id="telephone" placeholder="ex.xxx-xxx-xxxx">
                    </div>
                    <div class="mb-2">
                        <label for="province" class="form-label mb-1">Province</label>
                        <select class="form-select form-select-sm" id="province" aria-label="Select Province">
                            <option selected>เลือกจังหวัด</option>
                            <option value="1">กรุงเทพมหานคร</option>
                            <option value="2">ระยอง</option>
                            <option value="3">ชลบุรี</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label for="email" class="form-label mb-1">Email address</label>
                        <input type="email" class="form-control form-control-sm" id="email" placeholder="input email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label mb-1">Password</label>
                        <input type="password" class="form-control form-control-sm" id="password" placeholder="input password">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-sm px-3">Submit</button>
                        <button type="button" class="btn btn-secondary btn-sm px-3">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
